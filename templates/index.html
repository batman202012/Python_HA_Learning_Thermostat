<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermostat Control Node</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1e2130;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #f43f5e;
            --success: #10b981;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        h1 {
            color: var(--accent);
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background-color: var(--accent);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--accent);
            font-weight: 600;
            background-color: rgba(0,0,0,0.2);
        }

        tr:hover {
            background-color: rgba(255,255,255,0.02);
        }

        .score-positive {
            color: var(--success);
            font-weight: bold;
        }

        .score-negative {
            color: var(--danger);
            font-weight: bold;
        }

        .q-controls {
            display: flex;
            gap: 20px;
            background-color: #1e212b;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            color: #94a3b8;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .filter-group select {
            background-color: #15171e;
            color: #e2e8f0;
            border: 1px solid #2d313f;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            outline: none;
        }

        .filter-group select:focus {
            border-color: #4db8ff;
        }
    </style>
    <script>
    let globalQData = [];
    let performanceChart = null;

    async function loadQData() {
        try {
            const response = await fetch('/api/q_table');
            const result = await response.json();
            globalQData = result.data;

            populateDropdowns();
            renderFilteredMatrix();
        } catch (error) {
            console.error("Error fetching Q-Table:", error);
        }
    }

    function populateDropdowns() {
        const tempSelect = document.getElementById('temp-filter');
        const humidSelect = document.getElementById('humid-filter');
        const selectedPeakStr = document.getElementById('peak-filter') ? 
            document.getElementById('peak-filter').value : "false";

        if (!tempSelect || !humidSelect) {
            return;
        }

        // Capture user selections before clearing out items
        const currentTempSelection = tempSelect.value;
        const currentHumidSelection = humidSelect.value;

        const tempSet = new Set();
        const humidSet = new Set();

        // Standard structural definitions
        const standardTemps = [
            "<75 [Threat: <95]",
            "100-105 [Threat:100-104]"
        ];
        const standardHumids = [
            "30-45%",
            "10-15%"
        ];

        standardTemps.forEach(band => tempSet.add(band));
        standardHumids.forEach(band => humidSet.add(band));

        // Gather all existing weather bands from the array context safely
        globalQData.forEach(row => {
            if (row.temp_band && !row.temp_band.startsWith("<") || row.temp_band === "<75") {
                tempSet.add(row.temp_band);
            }
            if (row.humidity_band && !row.humidity_band.startsWith("<") || row.humidity_band === "<20%") {
                humidSet.add(row.humidity_band);
            }
        });

        // Recover background configuration parameters
        const defaultsBridge = document.getElementById('fallback-defaults');
        const defaultTempBand = defaultsBridge ? 
            defaultsBridge.getAttribute('data-temp') : "<75";
        const defaultHumidBand = defaultsBridge ? 
            defaultsBridge.getAttribute('data-humid') : "20-25%";

        if (defaultTempBand) {
            tempSet.add(defaultTempBand);
        }
        if (defaultHumidBand) {
            humidSet.add(defaultHumidBand);
        }

        // Determine intermediate current working keys to evaluate cross dependencies
        const activeTempFilter = currentTempSelection || defaultTempBand;
        const activeHumidFilter = currentHumidSelection || defaultHumidBand;

        tempSelect.innerHTML = '';
        humidSelect.innerHTML = '';

        // 1. Cross-Check Temperature against the active Humid Filter choice
        Array.from(tempSet).sort().forEach(band => {
            const hasDataCombination = globalQData.some(row => {
                const isPeakMatch = String(row.is_peak_pricing == 1) === selectedPeakStr;
                return String(row.temp_band) === String(band) &&
                       String(row.humidity_band) === String(activeHumidFilter) &&
                       isPeakMatch;
            });

            const styleAttr = hasDataCombination ? "" : " style='color: #64748b;'";
            tempSelect.innerHTML += 
                `<option value="${band}"${styleAttr}>${band}</option>`;
        });

        // 2. Cross-Check Humidity against the active Temp Filter choice
        Array.from(humidSet).sort().forEach(band => {
            const hasDataCombination = globalQData.some(row => {
                const isPeakMatch = String(row.is_peak_pricing == 1) === selectedPeakStr;
                return String(row.temp_band) === String(activeTempFilter) &&
                       String(row.humidity_band) === String(band) &&
                       isPeakMatch;
            });

            const styleAttr = hasDataCombination ? "" : " style='color: #64748b;'";
            humidSelect.innerHTML += 
                `<option value="${band}"${styleAttr}>${band}</option>`;
        });

        // Reapply selection pointer positions smoothly
        tempSelect.value = currentTempSelection || 
            sessionStorage.getItem("thermostat_temp_selection") || 
            defaultTempBand;
            
        humidSelect.value = currentHumidSelection || 
            sessionStorage.getItem("thermostat_humid_selection") || 
            defaultHumidBand;
    }

    function renderFilteredMatrix() {
        const container = document.getElementById('q-matrix-container');
        const tempSelect = document.getElementById('temp-filter');
        const humidSelect = document.getElementById('humid-filter');
        const selectedPeakStr = document.getElementById('peak-filter').value;

        if (!container || !tempSelect || !humidSelect) {
            return;
        }

        const selectedTemp = tempSelect.value;
        const selectedHumid = humidSelect.value;

        const filteredData = globalQData.filter(row => {
            const isRowPeak = (row.is_peak_pricing == 1 || 
                               row.is_peak_pricing === true) ? "true" : "false";
            return String(row.temp_band) === String(selectedTemp) && 
                String(row.humidity_band) === String(selectedHumid) && 
                isRowPeak === selectedPeakStr;
        });

        if (filteredData.length === 0) {
            container.innerHTML = '';
            return;
        }

        const standardTimeBlocks = [
            "Overnight", "Early Morning", "Late Morning", "Mid-Day", 
            "Early Afternoon", "Late Afternoon", "Peak Hours", "Evening", 
            "Late Night"
        ];

        const activeTimeBlocks = standardTimeBlocks.filter(time => 
            filteredData.some(row => row.time_block === time)
        );

        if (activeTimeBlocks.length === 0) {
            container.innerHTML = '';
            return;
        }

        const actionData = {};
        const activeActionsSet = new Set();

        filteredData.forEach(row => {
            if (!actionData[row.action_taken]) {
                actionData[row.action_taken] = {};
            }
            actionData[row.action_taken][row.time_block] = row.q_score;
            activeActionsSet.add(row.action_taken);
        });

        const actions = Array.from(activeActionsSet).sort();

        let html = `<div class="card">
            <h2>Q-Matrix Overview</h2>
            <div class="table-container">
            <table class="q-table">
            <thead>
            <tr>
            <th>Action / Time Block</th>
            ${activeTimeBlocks.map(time => `<th>${time}</th>`).join('')}
            </tr>
            </thead>
            <tbody>`;

        actions.forEach(action => {
            html += `<tr><td class="action-cell"><strong>${action}</strong></td>`;
            
            activeTimeBlocks.forEach(time => {
                const score = actionData[action] ? 
                    actionData[action][time] : undefined;
                let cellContent = '<span class="empty-cell">-</span>';
                let cellStyle = '';

                if (score !== undefined) {
                    cellContent = `<strong>${score.toFixed(1)}</strong>`;
                    cellStyle = `style="background-color: ${getHeatmapColor(score)}; color: #ffffff; text-shadow: 0px 1px 2px rgba(0,0,0,0.5);"`;
                }
                html += `<td ${cellStyle}>${cellContent}</td>`;
            });
            
            html += `</tr>`;
        });

        html += `</tbody></table></div></div>`;
        container.innerHTML = html;
    }

    function getHeatmapColor(score) {
        if (score > 0) {
            const intensity = Math.min(score / 10, 1);
            return `rgba(82, 196, 26, ${0.1 + (intensity * 0.7)})`;
        } else if (score < 0) {
            const intensity = Math.min(Math.abs(score) / 80, 1);
            return `rgba(255, 77, 79, ${0.1 + (intensity * 0.8)})`;
        }
        return 'rgba(255, 255, 255, 0.05)';
    }

    async function triggerRestart() {
        if (!confirm("Are you sure you want to restart the AI Node?")) {
            return;
        }

        const statusMsg = document.getElementById('statusMessage');
        statusMsg.innerText = "Restarting... please wait.";
        statusMsg.style.color = "var(--accent)";
        statusMsg.style.display = "block";

        try {
            const response = await fetch('/api/restart', { method: 'POST' });
            if (response.ok) {
                setTimeout(() => {
                    window.location.reload();
                }, 5000);
            }
        } catch (error) {
            console.error("Restart trigger failed", error);
        }
    }
    </script>
</head>
<body>

    <h1>Thermostat Control Node</h1>

    <div class="container">
        <div class="left-col">
            <div class="card">
                <h2>Manual Override / Schedule</h2>
                <div class="form-group">
                    <label>Target Temperature (°F)</label>
                    <input type="number" id="targetTemp" step="0.5" value="72">
                </div>
                <div class="form-group">
                    <label>Time Block</label>
                    <select id="timeBlock">
                        <option value="Overnight">Overnight (12am-5am)</option>
                        <option value="Early Morning">Early Morning (5am-8am)</option>
                        <option value="Late Morning">Late Morning (8am-10am)</option>
                        <option value="Mid-Day">Mid-Day (10am-12pm)</option>
                        <option value="Early Afternoon">Early Afternoon (12pm-2pm)</option>
                        <option value="Late Afternoon">Late Afternoon (2pm-4pm)</option>
                        <option value="Peak Hours">Peak Hours (4pm-7pm)</option>
                        <option value="Evening">Evening (7pm-10pm)</option>
                        <option value="Late Night">Late Night (10pm-12am)</option>
                    </select>
                </div>
                <div class="form-group">
                    <button onclick="updateSchedule()">Inject Configuration</button>
                </div>
                <p id="statusMessage" style="margin-top: 15px; font-size: 0.85rem; color: var(--success); display: none;"></p>
            </div>
            <div class="card" style="margin-top: 20px;">
                <h2>Live System Logs</h2>
                <div id="terminal-viewer" style="background-color: #050505; color: #38bdf8; font-family: monospace; font-size: 0.85em; padding: 15px; height: 500px; overflow-y: auto; border-radius: 6px; white-space: pre-wrap; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); line-height: 1.4;">Awaiting logs...</div>
            </div>
            <button onclick="triggerRestart()" style="background-color: var(--danger); margin-top: 10px;">
                Restart Service
            </button>
        </div>

        <div class="right-col">
            <div class="card" style="margin-bottom: 20px;">
                <h2>Cooling Performance</h2>
                <div style="position: relative; height: 300px; width: 100%;">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
            <div class="q-controls">
                <div class="filter-group">
                    <label>🌡️ Temperature Band:</label>
                    <select id="temp-filter"></select>
                </div>
                <div class="filter-group">
                    <label>💧 Humidity Band:</label>
                    <select id="humid-filter"></select>
                </div>
                <div class="filter-group">
                    <label>⚡ Pricing:</label>
                    <select id="peak-filter">
                        <option value="false">Standard Rate</option>
                        <option value="true">🔥 Peak Pricing</option>
                    </select>
                </div>
            </div>

            <div id="q-matrix-container"></div>

            <div class="card">
                <h2>Recent Execution Log</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Conditions</th>
                                <th>Action</th>
                                <th>Overrides</th>
                                <th>Net Reward</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <tr><td colspan="5">Loading execution history...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="fallback-defaults" 
         data-temp="{{ default_temp }}" 
         data-humid="{{ default_humid }}" 
         style="display: none !important;">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            loadQData();
            fetchHistory();
            fetchLogs();

            const tempSelect = document.getElementById('temp-filter');
            const humidSelect = document.getElementById('humid-filter');
            const peakSelect = document.getElementById('peak-filter');

            if (tempSelect && humidSelect && peakSelect) {
                tempSelect.addEventListener("change", function() {
                    sessionStorage.setItem("thermostat_temp_selection", this.value);
                    populateDropdowns(); // Trigger updates on cross selector elements
                    renderFilteredMatrix();
                });

                humidSelect.addEventListener("change", function() {
                    sessionStorage.setItem("thermostat_humid_selection", this.value);
                    populateDropdowns(); // Trigger updates on cross selector elements
                    renderFilteredMatrix();
                });

                peakSelect.addEventListener("change", function() {
                    populateDropdowns();
                    renderFilteredMatrix();
                });
            }

            setInterval(() => {
                loadQData();
                fetchHistory();
            }, 60000);

            setInterval(fetchLogs, 5000);
        });
    </script>
</body>
</html>
